apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: rook-ceph
    repo: https://charts.rook.io/release
    version: v1.20.1
    releaseName: rook-ceph
    namespace: rook-ceph
    valuesInline:
      crds:
        enabled: true
      ceph-csi-operator:
        controllerManager:
          manager:
            env:
              csiServiceAccountPrefix: "ceph-csi-"

resources:
  - ressources/cluster-external.yaml
  - ressources/common-external.yaml
  - ressources/csi-drivers.yaml
  - ressources/csi-rbac.yaml
  - ressources/objectstore-admin-secret.yaml
  - ressources/objectstore-external.yaml
  - ressources/storageclasses.yaml

patches:
  # The ceph-csi-operator subchart ServiceAccount has no namespace in its template,
  # so ArgoCD would apply it to the destination namespace (rook-ceph-external).
  # Force it into rook-ceph where the controller-manager Deployment expects it.
  - patch: |-
      - op: add
        path: /metadata/namespace
        value: rook-ceph
    target:
      group: ""
      version: v1
      kind: ServiceAccount
      name: ceph-csi
      labelSelector: "helm.sh/chart=ceph-csi-operator-1.0.1"
  # kube-score flags several checks on the upstream rook-ceph chart that the
  # club has no control over. See k8s-shared/README.md#politique-kube-score.
  # Note: CephCluster/OSD/mon/mgr Deployments are created dynamically by the
  # rook operator at runtime and are not part of this static kustomize build,
  # so only the operator + ceph-csi-operator controller are covered here.
  - target:
      kind: Deployment
      name: rook-ceph-operator
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: rook-ceph-operator
        annotations:
          kube-score/ignore: container-resources, container-ephemeral-storage-request-and-limit, container-security-context-user-group-id, pod-networkpolicy, container-image-tag, container-image-pull-policy
  - target:
      kind: Deployment
      name: ceph-csi-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ceph-csi-controller-manager
        annotations:
          kube-score/ignore: container-resources, container-ephemeral-storage-request-and-limit, container-security-context-user-group-id, pod-networkpolicy, container-image-tag, container-image-pull-policy