apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - resources/roles.yaml
  - resources/cluster-role.yaml
  - resources/policies.yaml
  - resources/secret-engine.yaml
  - resources/password-policy.yaml
  - resources/github-secret-engine.yaml
  - resources/authentik/

helmCharts:
  - name: vault
    version: "0.32.0"
    repo: "https://helm.releases.hashicorp.com"
    releaseName: "vault"
    namespace: vault
    valuesFile: "helm/vault.values.yaml"

  - name: vault-secrets-operator
    version: "1.4.0"
    repo: "https://helm.releases.hashicorp.com"
    releaseName: "vault-secrets-operator"
    namespace: vault
    valuesFile: "helm/vault-secrets-operator.values.yaml"
    includeCRDs: true

  - name: vault-config-operator
    version: "0.8.49"
    repo: "https://redhat-cop.github.io/vault-config-operator"
    releaseName: "vault-config-operator"
    namespace: vault
    valuesFile: "helm/vault-config-operator.values.yaml"
    includeCRDs: true

patches:
  - target:
      group: secrets.hashicorp.com
      version: v1beta1
      kind: VaultAuth
      name: vault-secrets-operator-default-transit-auth
    patch: |
      - op: replace
        path: /spec/namespace
        value: ""
  # kube-score flags several checks on the upstream HashiCorp charts that the
  # club has no control over (container-resources, ephemeral-storage,
  # runAsNonRoot uid/gid, missing NetworkPolicy, floating image tags). See
  # k8s-shared/README.md#politique-kube-score for the rationale/checklist.
  - target:
      kind: StatefulSet
      name: vault
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: vault
        annotations:
          kube-score/ignore: container-resources, container-ephemeral-storage-request-and-limit, container-security-context-user-group-id, pod-networkpolicy, container-image-tag, container-image-pull-policy
  - target:
      kind: Deployment
      name: vault-agent-injector
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vault-agent-injector
        annotations:
          kube-score/ignore: container-resources, container-ephemeral-storage-request-and-limit, container-security-context-user-group-id, pod-networkpolicy, container-image-tag, container-image-pull-policy
  - target:
      kind: Deployment
      name: vault-secrets-operator-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vault-secrets-operator-controller-manager
        annotations:
          kube-score/ignore: container-resources, container-ephemeral-storage-request-and-limit, container-security-context-user-group-id, pod-networkpolicy, container-image-tag, container-image-pull-policy
  - target:
      kind: Deployment
      name: vault-config-operator
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vault-config-operator
        annotations:
          kube-score/ignore: container-resources, container-ephemeral-storage-request-and-limit, container-security-context-user-group-id, pod-networkpolicy, container-image-tag, container-image-pull-policy
