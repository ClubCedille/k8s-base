apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-dns

helmCharts:
  - name: external-dns
    repo: oci://registry-1.docker.io/bitnamicharts
    version: 9.0.3
    releaseName: external-dns-cedille
    valuesFile: values.yaml

# kube-score flags several checks on the upstream Bitnami chart that the club
# has no control over. See k8s-shared/README.md#politique-kube-score.
patches:
  - target:
      kind: Deployment
      name: external-dns-cedille
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: external-dns-cedille
        annotations:
          kube-score/ignore: container-resources, container-ephemeral-storage-request-and-limit, container-security-context-user-group-id, pod-networkpolicy, container-image-tag, container-image-pull-policy
