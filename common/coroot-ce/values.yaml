apiKey:
metricsRefreshInterval: 15s
authAnonymousRole:
authBootstrapAdminPassword:

# Image built by the CEDILLE pipeline in CEDILLE/coroot.
# The registry is private: coroot-registry is synced from Vault by
# resources/vault.yaml and referenced here as an imagePullSecret.
communityEdition:
  image:
    name: git.etsmtl.club/cedille/coroot:1.29.4-cedille.2
    pullPolicy: IfNotPresent
    pullSecrets:
      - name: coroot-registry

#replicas: 1

service:
#  type: ClusterIP
#  port: 8080
#  nodePort:

ingress:
  className: contour
  host: coroot.etsmtl.club
  path: /
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    ingress.kubernetes.io/force-ssl-redirect: "true"
  tls:
    hosts:
      - coroot.etsmtl.club
    secretName: coroot-tls

storage:
  # The Coroot data dir holds db.sqlite plus a metric cache that grows over
  # time. 10Gi filled up after ~5 months and Coroot failed with
  # "disk I/O error: disk quota exceeded".
  size: 30Gi
  className: cephfs

resources:
#  requests:
#    cpu: 1
#    memory: 4Gi
#  limits:
#    cpu:
#    memory:

#env:
#  - name:
#    value:
env:
  - name: SSO_ENABLED
    value: "true"
  - name: SSO_PROVIDER
    value: oidc
  - name: SSO_DEFAULT_ROLE
    value: Viewer
  - name: SSO_OIDC_ISSUER_URL
    value: https://auth.etsmtl.club/application/o/coroot/
  - name: SSO_OIDC_REDIRECT_URL
    value: https://coroot.etsmtl.club/sso/oidc
  - name: SSO_OIDC_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: coroot-oidc-secret
        key: OIDC_CLIENT_ID
  - name: SSO_OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: coroot-oidc-secret
        key: OIDC_CLIENT_SECRET
  # Enable only after at least one SSO user has the Admin role:
  # - name: SSO_FORCE_SSO
  #   value: "true"

