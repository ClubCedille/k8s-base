apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: contour-external
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            stack: k8s-base
  template:
    metadata:
      name: "{{.name}}-contour-external"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "-70"
    spec:
      destination:
        namespace: contour-external
        server: "{{.server}}"
      project: "{{.name}}"
      source:
        repoURL: registry-1.docker.io/bitnamicharts
        chart: contour
        targetRevision: 19.5.11
        helm:
          values: |
            global:
              security:
                allowInsecureImages: true
            envoy:
              service:
                type: LoadBalancer
                {{- if eq .name "k8s-shared" }}
                # Pinned so kubelet/pods can resolve git.etsmtl.club to this
                # ClusterIP internally (registry-hosts Omni config patch),
                # bypassing the external VLAN hairpin path. Without pinning,
                # a Service delete/recreate would silently reassign this IP.
                clusterIP: "10.101.44.200"
                {{- end }}
                annotations:
                  metallb.io/allow-shared-ip: "shared-sharedmain-ip"
              image:
                registry: docker.io
                repository: envoyproxy/envoy
                tag: v1.31.10
              # Chart default (192Mi limit) OOM-kills envoy once the number of
              # HTTPProxies routed grows (35+ across apps as of 2026-08).
              # Envoy was crashlooping on OOM on multiple nodes, breaking
              # nextcloud/authentik SSO sessions intermittently.
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 300m
                  memory: 512Mi
            contour:
              replicaCount: 2
              envoyServiceNamespace: contour-external
              envoyServiceName: contour-external-envoy
              leaderElection:
                leaseDuration: 60s
                renewDeadline: 50s
                retryPeriod: 10s
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
              image:
                registry: ghcr.io
                repository: projectcontour/contour
                tag: v1.30.5
            namespaceOverride: contour-external
          releaseName: contour-external
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
