# Namespace-level operator role for Omni users whose AccessPolicy
# impersonates the "cedille-operator" group.
#
# This role can manage application workloads but cannot:
#   - touch cluster-scoped resources (nodes, namespaces, PVs, CRDs, ...)
#   - manage RBAC (roles, rolebindings, clusterroles, ...)
#   - impersonate service accounts or users
#
# NOTE: anyone who can create Pods can mount any Secret in the namespace.
# Direct Secret access is therefore not a real security boundary on its own;
# use dedicated namespaces and NetworkPolicies if you need hard isolation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cedille-operator
  labels:
    app.kubernetes.io/part-of: cedille-rbac
rules:
  # Read-only baseline.
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - persistentvolumeclaims
      - pods
      - pods/log
      - replicationcontrollers
      - resourcequotas
      - secrets
      - serviceaccounts
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - controllerrevisions
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingressclasses
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: ["get", "list", "watch"]

  # Workload management.
  - apiGroups: [""]
    resources:
      - configmaps
      - persistentvolumeclaims
      - pods
      - replicationcontrollers
      - secrets
      - services
    verbs: ["create", "delete", "deletecollection", "patch", "update"]
  - apiGroups: [""]
    resources:
      - pods/attach
      - pods/exec
      - pods/portforward
      - pods/proxy
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["create", "delete", "deletecollection", "patch", "update"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets/status
      - deployments/status
      - replicasets/status
      - statefulsets/status
    verbs: ["patch", "update"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets/scale
      - deployments/scale
      - replicasets/scale
      - statefulsets/scale
    verbs: ["patch", "update"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["create", "delete", "deletecollection", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["create", "delete", "deletecollection", "patch", "update"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["create", "delete", "deletecollection", "patch", "update"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["create", "delete", "deletecollection", "patch", "update"]
